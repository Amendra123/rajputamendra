      </div>

          <table *ngIf="dataLoaded" class="table mb-0" id="excel-table">
            <thead class="table-light">
              <tr>
                <th class="text-center">S.No</th>
                <th class="text-center">Category Name </th>
                
                <th class="text-center">Created At </th>
                <th class="text-center">Action </th>
  
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of category| paginate:{itemsPerPage: itemsPerPageC, currentPage:p};let i=index;">
                <td class="text-center" scope="row">{{(p - 1) * itemsPerPageC + i + 1}}</td>
                <td class="text-center">{{data?.category ? data?.category : 'N.A' }}</td>
               
                <td class="text-center">{{data.created_at ? (data?.created_at | date : 'dd-MM-yyyy h:mm a'): 'N.A'}}</td>
                <td><button routerLink="/package/category/{{data.id}}"><i class="fa fa-edit"></i></button>&nbsp;
                  <button routerLink="/package/delete/{{data.id}}"><i class="fa fa-trash"></i></button></td>
  
              </tr>
              <tr *ngIf="category && category?.length <= 0">
                <td colspan="9" class="text-center" style="color:rgb(143, 71, 71);">Records Not Found</td>
              </tr>
            </tbody>
          </table>

        <div *ngIf="category &&  category.length>0" id="pagination" class="mt-2">
          <pagination-controls (pageChange)="p=$event"></pagination-controls>
        </div>
