<div class="card-header topHeadList">
    <h4 class="card-title">Category Details </h4>

   

    <div class="display">
      <button class="btn btn-light selectbox" routerLink="/package/add-package">Add</button>&nbsp;
      <button class="btn btn-light selectbox" routerLink="/package/add-category">Add Category</button>&nbsp;
      <button class="btn btn-light selectbox" routerLink="/package/show-category">Show Category</button>&nbsp;
      <button class="btn btn-light selectbox" routerLink="/package/add-Subcategory">Add Sub-Category</button>&nbsp;
      <button class="btn btn-light selectbox" routerLink="/package/show-Subcategory">Show Sub-Category</button>&nbsp;
    </div>
</div>

<div class="col-xl-6">
    <div class="form-control">
    <div class="modal-content">
        <form [formGroup]="categoryForm">
            <div class="modal-header">
                <h4 class="modal-title" *ngIf="pageType=='add'">Add Category</h4>
                <h4 class="modal-title" *ngIf="pageType=='edit'">Edit Category</h4>
            </div>
            <div class="modal-body">
               
              
                  <div class="form-group">
                    <label for="cc-exp" class="control-label mb-1"></label>
                    <input name="category" type="text" formControlName="category"  nam="category"  class="form-control" placeholder="New Category" value="" data-val="true" > <br>
                </div>
            </div>
            <div class="modal-footer" *ngIf="pageType=='add'">
                <button type="submit" class="btn btn-success" [disabled]="categoryForm.invalid || categoryForm.pristine" (click)="addCategory()">Add New</button>
              
            </div>
            <div class="modal-footer" *ngIf="pageType=='edit'">
                <button type="submit" class="btn btn-success" [disabled]="categoryForm.invalid || categoryForm.pristine" (click)="editCategory()">Save</button>
              
            </div>
        </form>
    </div>
</div>
      </div>
